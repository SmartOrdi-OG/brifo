<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable: this is a phone app with one column and no
         maps or diagrams, so pinch-zoom has nothing to reveal — it only ever
         left the layout shifted sideways with the edges cut off, and getting
         back to a clean fit by hand is fiddly. Honoured by the installed PWA;
         Safari-the-browser ignores it, which is why the fields are also sized
         at 16px (see theme.css) so iOS never zooms in on focus either. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6fb" />
    <!-- Translucent status bar: lets the app's own (theme-aware) background show
         through the safe area on an installed iOS PWA, instead of iOS painting a
         fixed light bar there that ignores our dark-mode toggle at runtime. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Search and link previews. The app itself renders client-side, so these
         tags (plus the JSON-LD and the <noscript> text below) are what search
         engines and share previews see. Keep them in step with the Play listing. -->
    <meta
      name="description"
      content="Brifo erklärt Briefe in deiner Sprache, erinnert an Fristen und Termine und hilft beim Antworten auf Deutsch. Understand letters, never miss a deadline."
    />
    <link rel="canonical" href="https://mybrifo.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brifo" />
    <meta property="og:url" content="https://mybrifo.com/" />
    <meta property="og:title" content="Brifo – Briefe verstehen. Fristen nie verpassen." />
    <meta
      property="og:description"
      content="Brifo erklärt Briefe in deiner Sprache, erinnert an Fristen und hilft beim Antworten auf Deutsch. Jetzt auf Google Play."
    />
    <meta property="og:image" content="https://mybrifo.com/icons/apple-touch-icon-v3.png" />
    <meta property="og:locale" content="de_AT" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Brifo – Briefe verstehen. Fristen nie verpassen." />
    <meta
      name="twitter:description"
      content="Understand letters in your language, never miss a deadline, reply in German."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Brifo",
        "alternateName": "بريفو",
        "url": "https://mybrifo.com/",
        "operatingSystem": "Android, Web",
        "applicationCategory": "ProductivityApplication",
        "inLanguage": ["de", "en", "ar", "tr", "fa", "uk"],
        "description": "Brifo erklärt Briefe in deiner Sprache, erinnert an Fristen und Termine und hilft beim Antworten auf Deutsch.",
        "installUrl": "https://play.google.com/store/apps/details?id=com.mybrifo.twa",
        "sameAs": ["https://play.google.com/store/apps/details?id=com.mybrifo.twa"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "publisher": { "@type": "Organization", "name": "SmartOrdi OG", "url": "https://smartordiog.eu/" }
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Versioned filename: iOS caches the home-screen icon per URL and holds
         onto a failed fetch, so a bad first install keeps showing the grey
         letter placeholder no matter how the file is fixed. A new URL is the
         only way to make it fetch again. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Brifo – Briefe verstehen. Fristen nie verpassen. | بريفو</title>

    <!-- Language and direction before the first paint. React sets these too
         (LanguageContext), but not until it has mounted — long enough for a
         returning Arabic reader to see one frame of the English default laid
         out left-to-right, and for the whole layout to jump when it corrects.
         Same storage key and same fallback as readStoredLang(); keep them in
         step. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('brifo_lang');
          var lang = ['ar', 'de', 'tr', 'fa', 'en', 'uk'].indexOf(stored) >= 0 ? stored : 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' || lang === 'fa' ? 'rtl' : 'ltr';
        } catch (e) {
          /* Storage blocked: the static attributes above already say en/ltr. */
        }
      })();
    </script>

    <!-- Telegram Mini App SDK, loaded only when Telegram actually opened this
         page. Telegram appends #tgWebAppPlatform=… to the URL on every launch,
         so the check needs no SDK of its own — which is the point: putting a
         third-party script on every ordinary visit to mybrifo.com would cost
         every other visitor a request and a connection to telegram.org for a
         feature they never use. The sessionStorage key is the same one
         src/lib/telegramWebApp.ts reads; keep them in step. Runs before
         main.tsx, which is a deferred module. -->
    <script>
      (function () {
        try {
          var launched = (location.hash + location.search).indexOf('tgWebAppPlatform') !== -1;
          if (!launched && sessionStorage.getItem('brifo:is-telegram') !== '1') return;
          sessionStorage.setItem('brifo:is-telegram', '1');
          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          document.head.appendChild(s);
        } catch (e) {
          /* Locked-down embed: carry on as a plain web page. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only without JavaScript (and read by crawlers that skip it). -->
    <noscript>
      <h1>Brifo – Briefe verstehen. Fristen nie verpassen.</h1>
      <p>
        Brifo erklärt Briefe in deiner Sprache, erinnert an Fristen und Termine und hilft
        dir, auf Deutsch zu antworten.
      </p>
      <p>Understand letters in your language, never miss a deadline, and reply in German.</p>
      <p>
        <a href="https://play.google.com/store/apps/details?id=com.mybrifo.twa">Brifo auf Google Play</a>
        · Ein Produkt der <a href="https://smartordiog.eu/">SmartOrdi OG</a>, Linz.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
