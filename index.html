<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable: this is a phone app with one column and no
         maps or diagrams, so pinch-zoom has nothing to reveal — it only ever
         left the layout shifted sideways with the edges cut off, and getting
         back to a clean fit by hand is fiddly. Honoured by the installed PWA;
         Safari-the-browser ignores it, which is why the fields are also sized
         at 16px (see theme.css) so iOS never zooms in on focus either. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6fb" />
    <!-- Translucent status bar: lets the app's own (theme-aware) background show
         through the safe area on an installed iOS PWA, instead of iOS painting a
         fixed light bar there that ignores our dark-mode toggle at runtime. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Search and link previews. The app itself renders client-side, so these
         tags (plus the JSON-LD and the <noscript> text below) are what search
         engines and share previews see. Keep them in step with the Play listing. -->

    <!-- Favicons. Google shows a square raster favicon in search results and
         prefers sizes in multiples of 48px, so the 192px PNG comes first; the
         SVG is for browsers. /favicon.ico redirects to the same PNG (vercel.json). -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192-v3.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Versioned filename: iOS caches the home-screen icon per URL and holds
         onto a failed fetch, so a bad first install keeps showing the grey
         letter placeholder no matter how the file is fixed. A new URL is the
         only way to make it fetch again. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Brifo – Briefe verstehen. Fristen nie verpassen. | بريفو</title>

    <!-- Language and direction before the first paint. React sets these too
         (LanguageContext), but not until it has mounted — long enough for a
         returning Arabic reader to see one frame of the English default laid
         out left-to-right, and for the whole layout to jump when it corrects.
         Same storage key and same fallback as readStoredLang(); keep them in
         step. -->
    <script>
      (function () {
        // Outside the try: this is stamped before the bundle is even
        // requested, so the splash's minimum visible time
        // (src/lib/splashTiming.ts) is measured from what the user actually
        // saw. It must still be stamped when storage below throws.
        window.__splashStart = Date.now();
        try {
          var stored = localStorage.getItem('brifo_lang');
          var lang = ['ar', 'de', 'tr', 'fa', 'en', 'uk'].indexOf(stored) >= 0 ? stored : 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' || lang === 'fa' ? 'rtl' : 'ltr';
          // Same storage key as ThemeContext's readStoredTheme(); keep them in
          // step. Set here as well as there so the splash below is already the
          // right colour — ThemeContext cannot run until the bundle has, which
          // is the whole stretch the splash exists to cover.
          if (localStorage.getItem('brifo_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0b26');
          }
        } catch (e) {
          /* Storage blocked: the static attributes above already say en/ltr. */
        }
      })();
    </script>

    <!-- The splash, as plain HTML rather than a component.
         The app's bundle is about 1 MB, and until it has downloaded and parsed
         there is no React to render anything — on a slow phone that is the
         longest blank of the whole launch, and the one a parent would read as
         a broken app. A component cannot cover it, because the component is
         inside the thing being waited for.
         createRoot() clears #root on its first render, so this disappears by
         itself the moment React mounts; src/components/SplashScreen.tsx then
         shows the same thing, unchanged on screen, for as long as the session
         check runs. Keep the two in step. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: #f5f6fb;
        color: #1c1d3a;
      }
      :root[data-theme='dark'] #splash {
        background: #0b0b26;
        color: #f2f3ff;
      }
      #splash-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(59, 130, 246, 0.22);
        border-top-color: #3b82f6;
        animation: splash-spin 0.7s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-spinner {
          animation: none;
        }
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Telegram Mini App SDK, loaded only when Telegram actually opened this
         page. Telegram appends #tgWebAppPlatform=… to the URL on every launch,
         so the check needs no SDK of its own — which is the point: putting a
         third-party script on every ordinary visit to mybrifo.com would cost
         every other visitor a request and a connection to telegram.org for a
         feature they never use. The sessionStorage key is the same one
         src/lib/telegramWebApp.ts reads; keep them in step. Runs before
         main.tsx, which is a deferred module. -->
    <script>
      (function () {
        try {
          var launched = (location.hash + location.search).indexOf('tgWebAppPlatform') !== -1;
          if (!launched && sessionStorage.getItem('brifo:is-telegram') !== '1') return;
          sessionStorage.setItem('brifo:is-telegram', '1');
          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          document.head.appendChild(s);
        } catch (e) {
          /* Locked-down embed: carry on as a plain web page. */
        }
      })();
    </script>
  </head>
